<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat Privado 💖</title>
    <style>
        :root { --primary: #ff4d6d; --bg: #fce4ec; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; height: 100dvh; width: 100%; background: var(--bg); overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; }

        #app { 
            display: none; flex-direction: column; 
            width: 100%; max-width: 450px; height: 100%; 
            background: white; position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        /* LOGIN */
        #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        #login-box { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 320px; }
        #passInput { width: 100%; padding: 12px; margin: 20px 0; border: 2px solid #eee; border-radius: 10px; text-align: center; font-size: 20px; outline: none; }
        #loginBtn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }

        /* HEADER */
        #header { 
            background: var(--primary); color: white; padding: 0 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            height: 60px; min-height: 60px; flex-shrink: 0;
        }
        .h-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }

        /* CHAT BOX */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: #ffffff; }

        .msg-container { display: flex; flex-direction: column; max-width: 85%; }
        .me { align-self: flex-end; }
        .you { align-self: flex-start; }

        .msg { padding: 10px 15px; border-radius: 18px; font-size: 15px; word-wrap: break-word; cursor: pointer; position: relative; }
        .me .msg { background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .you .msg { background: #fff0f3; color: #590d22; border-bottom-left-radius: 2px; }

        .msg-meta { display: flex; gap: 12px; font-size: 11px; color: #888; margin-top: 5px; padding: 0 5px; }
        .me .msg-meta { justify-content: flex-end; }
        .action-link { cursor: pointer; text-decoration: none; color: inherit; font-weight: 500; }
        .action-link:hover { color: var(--primary); text-decoration: underline; }

        img { max-width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; }
        audio { width: 210px; height: 40px; margin-top: 5px; }

        /* FOOTER */
        #footer { background: white; border-top: 1px solid #eee; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
        .tool-bar { display: flex; gap: 25px; padding: 10px 20px; }
        .icon { font-size: 24px; cursor: pointer; transition: transform 0.1s; }
        
        .input-row { display: flex; gap: 10px; align-items: center; padding: 5px 15px 15px; }
        #msgInput { flex: 1; height: 42px; border: 1px solid #ddd; border-radius: 22px; padding: 0 15px; font-size: 16px; outline: none; }
        #sendBtn { background: var(--primary); border: none; color: white; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        #status { height: 18px; font-size: 11px; color: var(--primary); padding: 0 15px; font-style: italic; }
        #reply-preview { display: none; background: #f8f8f8; padding: 10px; border-left: 4px solid var(--primary); justify-content: space-between; align-items: center; }
        #emoji-shelf { display: none; grid-template-columns: repeat(8, 1fr); gap: 10px; padding: 15px; background: #fff; border-top: 1px solid #eee; max-height: 150px; overflow-y: auto; }
        .emoji { font-size: 22px; cursor: pointer; text-align: center; }

        /* LIGHTBOX */
        #lightbox-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.92); z-index: 20000;
            flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        #lightbox-actions {
            position: absolute; top: 15px; right: 15px;
            display: flex; gap: 10px; align-items: center;
        }
        .lb-btn {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 8px 14px; border-radius: 20px; cursor: pointer;
            font-size: 14px; font-weight: bold; text-decoration: none;
        }
        #lightbox-img {
            max-width: 95%; max-height: 82vh; object-fit: contain;
            border-radius: 10px; margin-top: 0; cursor: default;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* PAGINACIÓN Y SCROLL INTELIGENTE */
        #load-more-btn {
            display: none; align-self: center;
            background: #fff0f3; color: var(--primary);
            border: 1px solid rgba(255, 77, 109, 0.3);
            padding: 6px 14px; border-radius: 16px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            flex-shrink: 0;
        }
        #scroll-down-btn {
            display: none; position: absolute; right: 16px; bottom: 130px;
            background: var(--primary); color: white; border: none;
            padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.35);
            cursor: pointer; z-index: 500;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="login-screen">
    <div id="login-box">
        <h3 style="color: var(--primary); margin-bottom: 10px;">🔒 Acceso Privado</h3>
        <input type="password" id="passInput" placeholder="0000" maxlength="4" inputmode="numeric">
        <button id="loginBtn" onclick="checkPass()">Entrar</button>
    </div>
</div>

<div id="app">
    <header id="header">
        <span style="font-weight: bold; font-size: 18px;">💖 Nuestro Chat</span>
        <div style="display:flex; gap:8px;">
            <button class="h-btn" onclick="iniciarVideo()">📹 Video</button>
            <button class="h-btn" onclick="limpiarChat()">Borrar</button>
        </div>
    </header>
    
    <main id="chat-box">
        <button id="load-more-btn" onclick="cargarAnteriores()">⬆ Cargar mensajes anteriores</button>
    </main>
    <button id="scroll-down-btn" onclick="bajarAlFinal()">↓ Nuevo mensaje</button>
    <div id="status"></div>
    <div id="reply-preview">
        <div id="reply-text" style="font-size:12px; color:#666; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></div>
        <span onclick="cancelarRespuesta()" style="cursor:pointer; font-weight:bold; color:var(--primary); padding:5px;">✕</span>
    </div>

    <footer id="footer">
        <div id="emoji-shelf"></div>
        <div class="tool-bar">
            <span class="icon" onclick="document.getElementById('fileInput').click()">📷</span>
            <span class="icon" id="micBtn">🎙️</span>
            <span class="icon" onclick="toggleEmojis()">😊</span>
        </div>
        <div class="input-row">
            <input type="file" id="fileInput" accept="image/*" style="display:none">
            <input type="text" id="msgInput" placeholder="Escríbele a tu pareja..." autocomplete="off">
            <button id="sendBtn" onclick="enviar()">➤</button>
        </div>
    </footer>
</div>

<div id="lightbox-modal" onclick="if(event.target === this) cerrarLightbox()">
    <div id="lightbox-actions">
        <a id="lightbox-download" class="lb-btn" download="foto-chat.jpg">⬇ Descargar</a>
        <button class="lb-btn" onclick="cerrarLightbox()">✕</button>
    </div>
    <img id="lightbox-img" src="" alt="Vista previa">
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, remove, set, onValue, serverTimestamp, query, orderByKey, limitToLast, endBefore, get, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyClp2tVcoeIE_ZOedIzP6zyEXEoP9Em0tM",
        authDomain: "chatpareja-3fbce.firebaseapp.com",
        databaseURL: "https://chatpareja-3fbce-default-rtdb.firebaseio.com",
        projectId: "chatpareja-3fbce",
        storageBucket: "chatpareja-3fbce.firebasestorage.app",
        messagingSenderId: "954583350974",
        appId: "1:954583350974:web:8a1b6dfdaddd1b54d728ef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'messages');

    // --- IDENTIDAD FIJA CON DOS PINS ---
    const PINS = {
        "9395": "pareja_1",
        "9593": "pareja_2"
    };
    let myId = localStorage.getItem('chat_id') || '';
    let chatIniciado = false;

    // --- ESTADO DE PAGINACIÓN, AUDIO Y ESCRITURA ---
    const PAGE_SIZE = 40;
    const loadedKeys = new Set();
    let oldestKey = null;
    let cargandoAnteriores = false;
    let estaEscribiendo = false;
    let audioActivo = null;

    const box = document.getElementById('chat-box');
    const input = document.getElementById('msgInput');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const scrollDownBtn = document.getElementById('scroll-down-btn');

    const estaCercaDelFinal = () => (box.scrollHeight - box.scrollTop - box.clientHeight) < 120;
    window.bajarAlFinal = () => {
        box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        scrollDownBtn.style.display = 'none';
    };
    box.addEventListener('scroll', () => {
        if (estaCercaDelFinal()) scrollDownBtn.style.display = 'none';
    });

    window.checkPass = () => {
        const pinIngresado = document.getElementById('passInput').value;
        if(PINS[pinIngresado]) {
            myId = PINS[pinIngresado];
            localStorage.setItem('chat_id', myId);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            if(!chatIniciado) iniciarChat();
            setTimeout(() => { box.scrollTop = box.scrollHeight; }, 300);
        } else { alert("Clave Incorrecta"); }
    };
    document.getElementById('passInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') checkPass(); });

    window.iniciarVideo = () => window.open(`https://meet.jit.si/ChatPrivado_9395`, '_blank');

    // --- LIGHTBOX ---
    window.abrirLightbox = (src) => {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox-download').href = src;
        document.getElementById('lightbox-modal').style.display = 'flex';
    };
    window.cerrarLightbox = () => {
        document.getElementById('lightbox-modal').style.display = 'none';
        document.getElementById('lightbox-img').src = '';
    };
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') cerrarLightbox(); });

    let msgRespuesta = null;
    window.prepararRespuesta = (t) => {
        msgRespuesta = t;
        document.getElementById('reply-text').innerText = "Respondiendo a: " + t;
        document.getElementById('reply-preview').style.display = 'flex';
        input.focus();
    };
    window.cancelarRespuesta = () => { msgRespuesta = null; document.getElementById('reply-preview').style.display = 'none'; };

    // Emojis
    const emojis = ["❤️","😘","😍","😊","🔥","✨","💖","🥰","🤩","🤣","🧸","🌹","😜","😇","💤","🌸"];
    const shelf = document.getElementById('emoji-shelf');
    emojis.forEach(e => {
        const span = document.createElement('span'); span.className = 'emoji'; span.innerText = e;
        span.onclick = () => { input.value += e; input.focus(); };
        shelf.appendChild(span);
    });
    window.toggleEmojis = () => { shelf.style.display = shelf.style.display === 'grid' ? 'none' : 'grid'; box.scrollTop = box.scrollHeight; };

    // --- AUDIO COMPATIBLE Y LIGERO ---
    const detectarMimeAudio = () => {
        const tipos = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
        return tipos.find(t => typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t)) || '';
    };

    let rec; let chunks = [];
    document.getElementById('micBtn').onclick = async () => {
        if (!rec || rec.state === "inactive") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = detectarMimeAudio();
                const opciones = { audioBitsPerSecond: 32000 };
                if (mimeType) opciones.mimeType = mimeType;
                try {
                    rec = new MediaRecorder(stream, opciones);
                } catch {
                    rec = new MediaRecorder(stream);
                }
                chunks = [];
                rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                rec.onstop = () => {
                    const tipoFinal = rec.mimeType || mimeType || 'audio/webm';
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(chunks, { type: tipoFinal }));
                    reader.onloadend = () => push(chatRef, { userId: myId, audioData: reader.result, type: 'audio', time: serverTimestamp() });
                    stream.getTracks().forEach(t => t.stop());
                };
                rec.start(); document.getElementById('micBtn').innerText = '🛑';
                estaEscribiendo = false;
                clearTimeout(window.tOut);
                set(ref(db, 'status/'+myId), { action: 'grabando' });
            } catch(e) { alert("Micro bloqueado"); }
        } else { 
            rec.stop(); document.getElementById('micBtn').innerText = '🎙️'; 
            set(ref(db, 'status/'+myId), null);
        }
    };

    window.enviar = () => {
        const t = input.value.trim();
        if(t) {
            push(chatRef, { userId: myId, text: t, replyTo: msgRespuesta, type: 'text', time: serverTimestamp() });
            input.value = ''; cancelarRespuesta(); shelf.style.display = 'none';
            if (estaEscribiendo) {
                estaEscribiendo = false;
                clearTimeout(window.tOut);
                set(ref(db, 'status/'+myId), null);
            }
        }
    };
    input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') {
            e.preventDefault();
            enviar();
        }
    });

    // --- COMPRESIÓN DE IMÁGENES ---
    const comprimirImagen = (file, maxDim = 1000, calidad = 0.7) => new Promise((resolve) => {
        const r = new FileReader();
        r.readAsDataURL(file);
        r.onload = (ev) => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
                let w = img.width;
                let h = img.height;
                if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', calidad));
            };
        };
    });

    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const comprimida = await comprimirImagen(file);
        push(chatRef, { userId: myId, imageData: comprimida, type: 'image', time: serverTimestamp() });
        e.target.value = '';
    };

    window.borrarMsg = (key) => { if(confirm("¿Borrar mensaje?")) remove(ref(db, 'messages/' + key)); };

    // --- LÓGICA DE VIBRACIÓN ---
    const vibrarNuevoMensaje = () => {
        if ("vibrate" in navigator) {
            navigator.vibrate([200, 100, 200]); // Vibra 200ms, pausa 100ms, vibra 200ms
        }
    };

    // --- RENDERIZADO SEGURO (SIN XSS NI FALLOS CON COMILLAS) ---
    const crearElementoMensaje = (k, d, mantenerAbajoAlCargarImg = false) => {
        const div = document.createElement('div');
        div.className = `msg-container ${d.userId === myId ? 'me' : 'you'}`;
        div.id = 'msg-' + k;

        const textoRespuesta = d.text || 'Archivo';
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg';
        msgDiv.addEventListener('click', () => prepararRespuesta(textoRespuesta));

        if (d.replyTo) {
            const replyDiv = document.createElement('div');
            replyDiv.style.cssText = 'font-size:11px; opacity:0.6; border-left:2px solid; padding-left:5px; margin-bottom:5px;';
            replyDiv.textContent = d.replyTo;
            msgDiv.appendChild(replyDiv);
        }

        if (d.audioData) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = d.audioData;
            audio.addEventListener('click', (e) => e.stopPropagation());
            audio.addEventListener('play', () => {
                if (audioActivo && audioActivo !== audio) audioActivo.pause();
                audioActivo = audio;
            });
            msgDiv.appendChild(audio);
        } else if (d.imageData) {
            const img = document.createElement('img');
            img.src = d.imageData;
            img.loading = 'lazy';
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                abrirLightbox(img.src);
            });
            if (mantenerAbajoAlCargarImg) {
                img.addEventListener('load', () => {
                    if (estaCercaDelFinal()) box.scrollTop = box.scrollHeight;
                }, { once: true });
            }
            msgDiv.appendChild(img);
        } else {
            const span = document.createElement('span');
            span.textContent = d.text || '';
            msgDiv.appendChild(span);
        }

        const metaDiv = document.createElement('div');
        metaDiv.className = 'msg-meta';

        const replyLink = document.createElement('span');
        replyLink.className = 'action-link';
        replyLink.textContent = 'Responder';
        replyLink.addEventListener('click', () => prepararRespuesta(textoRespuesta));
        metaDiv.appendChild(replyLink);

        if (d.userId === myId) {
            metaDiv.appendChild(document.createTextNode(' • '));
            const delLink = document.createElement('span');
            delLink.className = 'action-link';
            delLink.textContent = 'Borrar';
            delLink.addEventListener('click', () => borrarMsg(k));
            metaDiv.appendChild(delLink);
        }

        div.appendChild(msgDiv);
        div.appendChild(metaDiv);
        return div;
    };

    window.cargarAnteriores = async () => {
        if (!oldestKey || cargandoAnteriores) return;
        cargandoAnteriores = true;
        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = 'Cargando...';

        const prevHeight = box.scrollHeight;
        const prevTop = box.scrollTop;

        try {
            const snap = await get(query(chatRef, orderByKey(), endBefore(oldestKey), limitToLast(PAGE_SIZE + 1)));
            if (!snap.exists()) {
                loadMoreBtn.style.display = 'none';
            } else {
                const items = [];
                snap.forEach((child) => { items.push({ key: child.key, val: child.val() }); });

                const hayMas = items.length > PAGE_SIZE;
                if (hayMas) items.shift();

                if (items.length > 0) {
                    oldestKey = items[0].key;
                    const frag = document.createDocumentFragment();
                    items.forEach(({ key, val }) => {
                        if (!loadedKeys.has(key)) {
                            loadedKeys.add(key);
                            frag.appendChild(crearElementoMensaje(key, val, false));
                        }
                    });
                    loadMoreBtn.insertAdjacentElement('afterend', document.createElement('span'));
                    const marcador = loadMoreBtn.nextSibling;
                    box.insertBefore(frag, marcador);
                    marcador.remove();
                    box.scrollTop = prevTop + (box.scrollHeight - prevHeight);
                }

                loadMoreBtn.style.display = hayMas ? 'block' : 'none';
            }
        } finally {
            loadMoreBtn.disabled = false;
            loadMoreBtn.textContent = '⬆ Cargar mensajes anteriores';
            cargandoAnteriores = false;
        }
    };

    async function iniciarChat() {
        chatIniciado = true;

        // Limpieza automática del estado si se cierra la app o cae la conexión
        onValue(ref(db, '.info/connected'), (snap) => {
            if (snap.val() === true && myId) {
                onDisconnect(ref(db, 'status/' + myId)).remove();
            }
        });

        // 1. Carga inicial paginada (sin vibraciones fantasma)
        const snapInicial = await get(query(chatRef, orderByKey(), limitToLast(PAGE_SIZE + 1)));
        if (snapInicial.exists()) {
            const items = [];
            snapInicial.forEach((child) => { items.push({ key: child.key, val: child.val() }); });
            const hayMas = items.length > PAGE_SIZE;
            if (hayMas) items.shift();

            if (items.length > 0) {
                oldestKey = items[0].key;
                const frag = document.createDocumentFragment();
                items.forEach(({ key, val }) => {
                    loadedKeys.add(key);
                    frag.appendChild(crearElementoMensaje(key, val, true));
                });
                box.appendChild(frag);
            }
            loadMoreBtn.style.display = hayMas ? 'block' : 'none';
            box.scrollTop = box.scrollHeight;
        }

        // 2. Escucha en tiempo real solo para mensajes nuevos
        onChildAdded(query(chatRef, orderByKey(), limitToLast(PAGE_SIZE)), (snap) => {
            const k = snap.key;
            if (loadedKeys.has(k)) return;
            loadedKeys.add(k);
            if (!oldestKey || k < oldestKey) oldestKey = k;

            const d = snap.val();
            const cerca = estaCercaDelFinal();

            // VIBRAR SOLO SI EL MENSAJE ES NUEVO Y NO ES MÍO
            if (d.userId !== myId) {
                vibrarNuevoMensaje();
            }

            const el = crearElementoMensaje(k, d, d.userId === myId || cerca);
            box.appendChild(el);

            if (d.userId === myId || cerca) {
                box.scrollTop = box.scrollHeight;
                scrollDownBtn.style.display = 'none';
            } else {
                scrollDownBtn.style.display = 'block';
            }
        });

        onChildRemoved(chatRef, (s) => {
            loadedKeys.delete(s.key);
            document.getElementById('msg-' + s.key)?.remove();
            if (loadedKeys.size === 0) {
                oldestKey = null;
                loadMoreBtn.style.display = 'none';
            }
        });

        onValue(ref(db, 'status'), (s) => {
            const d = s.val(); let t = "";
            for(let id in d) if(id !== myId) t = d[id]?.action === 'grabando' ? "Tu pareja está Grabando..." : "Tu pareja está Escribiendo...";
            document.getElementById('status').textContent = t;
        });
    }

    window.limpiarChat = () => confirm("¿Borrar todo?") && remove(chatRef);

    // Control optimizado de escrituras en "Escribiendo..."
    input.oninput = () => {
        if (!myId) return;
        if (!estaEscribiendo) {
            estaEscribiendo = true;
            set(ref(db, 'status/' + myId), { action: 'escribiendo' });
        }
        clearTimeout(window.tOut);
        window.tOut = setTimeout(() => {
            estaEscribiendo = false;
            set(ref(db, 'status/' + myId), null);
        }, 2000);
    };
</script>
</body>
</html>
